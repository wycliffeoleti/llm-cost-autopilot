[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-autopilot"
version = "0.1.0"
description = "BASWE Project 2 - offline LLM routing and simulated verification"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4,<2",
    "numpy>=1.26,<2",
    "pyyaml>=6.0,<7",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6.0,<7",
    "httpx2>=2.9.1",
]

[tool.setuptools]
packages = ["costpilot", "costpilot.providers"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = []
exclude = ["tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*"]
ignore_missing_imports = true
